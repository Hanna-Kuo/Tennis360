# TennisPose target ranges
# ---------------------------------------------------------------------------
# ALL VALUES ARE DEMONSTRATION REFERENCES (source: demo).
# They are NOT validated coaching, medical, or biomechanical standards.
# A coach should replace them with their own standards and set source: coach.
# Action keys must match the CLI --action names so each analysis looks up
# its own range.
serve:
  min_deg: 80.0
  max_deg: 120.0
  source: demo
forehand:
  min_deg: 130.0
  max_deg: 170.0
  source: demo
backhand-one:
  min_deg: 140.0
  max_deg: 175.0
  source: demo
backhand-two:
  min_deg: 140.0
  max_deg: 175.0
  source: demo
# Extra groundstroke thresholds (not angles). Same demo honesty applies.
groundstroke_extras:
  followthrough_min_rise: 0.2
  shoulder_turn_min_deg: 20.0
  contact_in_front_min: 0.15
  source: demo
